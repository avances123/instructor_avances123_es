{{- define "main" }}
<div class="container min-h-80 text-center" style="display:flex;justify-content:center;align-items:center">
    <div>
        {{.Content}}
    </div>    
</div>

<script>
    try {
        var submittedAt = Number(sessionStorage.getItem('contact_form_pending'));
        sessionStorage.removeItem('contact_form_pending');
        if (submittedAt > 0 && Date.now() - submittedAt < 30 * 60 * 1000 &&
                Date.now() >= submittedAt && typeof trackLead === 'function') {
            trackLead('form', 'contact_form_submit', '', '');
        }
    } catch (e) {}
</script>
{{ end }}
