{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": {{ .Site.Title }},
  "alternateName": "Sidemount Spain",
  "url": {{ .Site.BaseURL }},
  "description": {{ .Site.Params.description | plainify }},
  "logo": {{ .Site.Params.assets.favicon | default "favicon.ico" | absURL }},
  "sameAs": [
    "https://www.youtube.com/@sidemount_spain",
    "https://www.instagram.com/sidemount_spain/"
  ]
}
</script>
{{- else if and (or .IsPage .IsSection) (not .Params.noindex) (ne .Layout "thanks") }}
{{- $scratch := newScratch }}
{{- $scratch.Set "pos" 1 }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Inicio",
      "item": {{ .Site.BaseURL }}
    }
    {{- if and .Parent (not .Parent.IsHome) -}}
      {{- if and .Parent.Parent (not .Parent.Parent.IsHome) -}}
        {{- $scratch.Add "pos" 1 | safeJS -}},
    {
      "@type": "ListItem",
      "position": {{ $scratch.Get "pos" }},
      "name": {{ .Parent.Parent.Title }},
      "item": {{ .Parent.Parent.Permalink }}
    }
      {{- end -}}
      {{- $scratch.Add "pos" 1 | safeJS -}},
    {
      "@type": "ListItem",
      "position": {{ $scratch.Get "pos" }},
      "name": {{ .Parent.Title }},
      "item": {{ .Parent.Permalink }}
    }
    {{- end -}}
    {{- $scratch.Add "pos" 1 | safeJS -}},
    {
      "@type": "ListItem",
      "position": {{ $scratch.Get "pos" }},
      "name": {{ .Title }},
      "item": {{ .Permalink }}
    }
  ]
}
</script>

{{- if eq .Layout "curso" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Course",
  "name": {{ .Title | plainify }},
  "description": {{ with (.Params.seoDescription | default .Description) | plainify }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }},
  "url": {{ .Permalink }},
  "inLanguage": "es",
  {{ if .Params.cover.image -}}
  "image": {{ .Params.cover.image | absURL }},
  {{- end }}
  "provider": {
    "@type": "Organization",
    "name": "Sidemount Spain",
    "url": {{ .Site.BaseURL }}
  }
}
</script>
{{- else if and .IsPage (ne .Layout "contact") }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | plainify }},
  "name": {{ .Title | plainify }},
  "description": {{ with (.Params.seoDescription | default .Description) | plainify }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }},
  "wordCount": "{{ .WordCount }}",
  "inLanguage": "es",
  {{ if .Params.cover.image -}}
  "image": {{ .Params.cover.image | absURL }},
  {{- end }}
  {{ if gt .PublishDate.Year 1 -}}
  "datePublished": {{ .PublishDate.Format "2006-01-02T15:04:05-07:00" }},
  {{- end }}
  {{ if gt .Lastmod.Year 1 -}}
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05-07:00" }},
  {{- end }}
  "author": {
    "@type": "Person",
    "name": {{ .Params.author | default .Site.Params.author }}
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink }}
  },
  "publisher": {
    "@type": "Organization",
    "name": {{ .Site.Title }},
    "logo": {
      "@type": "ImageObject",
      "url": {{ .Site.Params.assets.favicon | default "favicon.ico" | absURL }}
    }
  }
}
</script>
{{- end }}
{{- end -}}
