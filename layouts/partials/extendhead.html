<!-- Google Consent Mode & Google Analytics (GA4) -->
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    (function() {
        var consent = null;
        try {
            consent = localStorage.getItem('cookie_consent');
        } catch (e) {}

        var isGranted = consent === 'granted';

        gtag('consent', 'default', {
            'analytics_storage': isGranted ? 'granted' : 'denied',
            'ad_storage': isGranted ? 'granted' : 'denied',
            'ad_user_data': isGranted ? 'granted' : 'denied',
            'ad_personalization': isGranted ? 'granted' : 'denied'
        });
    })();
</script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NFPNJYXW0E"></script>
<script>
    gtag('js', new Date());
    gtag('config', 'G-NFPNJYXW0E');
</script>

<!-- Conversion Tracking Helpers -->
<script>
    function trackLead(method, source, courseName, targetUrl) {
        var callbackTriggered = false;
        function doNavigate() {
            if (!callbackTriggered && typeof targetUrl === 'string' && targetUrl) {
                callbackTriggered = true;
                if (targetUrl.indexOf('whatsapp.com') !== -1 || targetUrl.indexOf('wa.me') !== -1) {
                    window.open(targetUrl, '_blank');
                } else {
                    window.location.href = targetUrl;
                }
            }
        }

        if (typeof gtag === 'function') {
            gtag('event', 'generate_lead', {
                'lead_method': method || 'generic',
                'lead_source': source || window.location.pathname,
                'course_name': courseName || '',
                'event_callback': doNavigate,
                'event_timeout': 1500
            });
            gtag('event', 'conversion_event_contact', {
                'lead_method': method || 'generic',
                'lead_source': source || window.location.pathname,
                'course_name': courseName || ''
            });
        } else {
            doNavigate();
        }
        return false;
    }

    // Helper retrocompatible para llamadas existentes
    function gtagSendEvent(url) {
        return trackLead('whatsapp', 'header', '', url);
    }
</script>
